<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 Vietnam Golf Legends Scorecard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sticky-col-header {
            position: sticky;
            left: 0;
            z-index: 10;
        }
        .hole-input {
            width: 1.75rem;
            height: 1.25rem;
            text-align: center;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .hole-input:focus {
            outline: none;
            background-color: white;
            color: black;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-100 min-h-screen p-2 md:p-6 text-gray-800">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-3xl md:text-5xl font-extrabold text-emerald-800 tracking-tight">2025 Vietnam Golf Legends</h1>
            <p id="user-id-display" class="text-xs text-gray-500 mt-1">Connecting to live synchronization...</p>
        </header>

        <!-- Navigation -->
        <nav class="flex justify-center gap-2 mb-6">
            <button id="scorecard-btn" class="px-4 py-2 rounded-lg font-semibold transition-all shadow-lg bg-gray-700 text-white">Scorecard</button>
            <button id="form-guide-btn" class="px-4 py-2 rounded-lg font-semibold transition-all bg-gray-200 text-gray-800 hover:bg-gray-300">Form Guide</button>
            <button id="rules-btn" class="px-4 py-2 rounded-lg font-semibold transition-all bg-gray-200 text-gray-800 hover:bg-gray-300">Rules</button>
            <button id="groups-btn" class="px-4 py-2 rounded-lg font-semibold transition-all bg-gray-200 text-gray-800 hover:bg-gray-300">Groups</button>
        </nav>

        <!-- Main Content View Container -->
        <main id="content" class="bg-white/80 backdrop-blur-md p-4 md:p-6 rounded-2xl shadow-xl border border-white/50 min-h-[500px]">
            <div class="flex items-center justify-center h-64 text-gray-500 font-medium">Loading Scorecard...</div>
        </main>
    </div>

    <!-- Status Notification Modal -->
    <div id="status-modal" class="fixed bottom-4 right-4 hidden items-center bg-gray-900 text-white px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 z-50 border border-gray-700">
        <span id="status-message" class="text-sm font-medium">Saved</span>
    </div>

    <!-- Firebase SDK Imports & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, setDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAuErizAOC5FCAVyNb-KfAlmqpoHqhflHQ",
            authDomain: "interactive-golf-scorecard-app.firebaseapp.com",
            projectId: "interactive-golf-scorecard-app",
            storageBucket: "interactive-golf-scorecard-app.firebasestorage.app",
            messagingSenderId: "301146578542",
            appId: "1:301146578542:web:1e7515a3ab3c84fd5c507f",
            measurementId: "G-48RGNE7JVN"
        };
        const appId = firebaseConfig.appId;

        let roundsData = {
            1: {
                course: 'Ba Na Hills', tees: 'white tees', slope: 133, scratch: 69.6, par: 72,
                holes: [
                    {par: 4, hcap: 9}, {par: 4, hcap: 11}, {par: 5, hcap: 3}, {par: 3, hcap: 15}, {par: 4, hcap: 1}, {par: 4, hcap: 13}, {par: 4, hcap: 7}, {par: 3, hcap: 17}, {par: 5, hcap: 5},
                    {par: 4, hcap: 14}, {par: 4, hcap: 16}, {par: 3, hcap: 18}, {par: 5, hcap: 4}, {par: 4, hcap: 2}, {par: 4, hcap: 10}, {par: 3, hcap: 12}, {par: 4, hcap: 6}, {par: 5, hcap: 8}
                ],
                players: [
                    { name: 'Ben', aguHCap: '19.9', dailyHCap: 19.55 }, { name: 'Ian', aguHCap: '16.9', dailyHCap: 16.27 },
                    { name: 'Peter', aguHCap: '23.5', dailyHCap: 23.49 }, { name: 'Q', aguHCap: '10', dailyHCap: 28.20 },
                    { name: 'Neal', aguHCap: '7.1', dailyHCap: 5.54 }, { name: 'Dennis', aguHCap: '14.3', dailyHCap: 13.42 },
                    { name: 'TK', aguHCap: '10', dailyHCap: 30.39 }, { name: 'Brad', aguHCap: '31', dailyHCap: 31.70 }
                ]
            },
            2: {
                course: 'Montgomerie Golf Links', tees: 'blue tees', slope: 135, scratch: 72, par: 72,
                holes: [
                    {par: 5, hcap: 3}, {par: 3, hcap: 15}, {par: 4, hcap: 9}, {par: 4, hcap: 11}, {par: 3, hcap: 17}, {par: 5, hcap: 13}, {par: 4, hcap: 1}, {par: 4, hcap: 7}, {par: 4, hcap: 5},
                    {par: 4, hcap: 8}, {par: 3, hcap: 18}, {par: 5, hcap: 4}, {par: 4, hcap: 2}, {par: 3, hcap: 12}, {par: 4, hcap: 16}, {par: 4, hcap: 10}, {par: 4, hcap: 6}, {par: 5, hcap: 14}
                ],
                players: [
                    { name: 'Ben', aguHCap: '19.9', dailyHCap: 19.88 }, { name: 'Ian', aguHCap: '16.9', dailyHCap: 16.54 },
                    { name: 'Peter', aguHCap: '23.5', dailyHCap: 23.88 }, { name: 'Neale', aguHCap: '27.8', dailyHCap: 28.66 },
                    { name: 'Neal', aguHCap: '7.1', dailyHCap: 5.66 }, { name: 'Dennis', aguHCap: '14.3', dailyHCap: 13.66 },
                    { name: 'Tony', aguHCap: '29.8', dailyHCap: 30.88 }, { name: 'Brad', aguHCap: '31', dailyHCap: 32.21 }
                ]
            },
            3: {
                course: 'Hoiana Shores', tees: 'black tees', slope: 140, scratch: 73, par: 72,
                holes: [
                    {par: 4, hcap: 9}, {par: 4, hcap: 11}, {par: 5, hcap: 3}, {par: 3, hcap: 15}, {par: 4, hcap: 1}, {par: 4, hcap: 13}, {par: 4, hcap: 7}, {par: 3, hcap: 17}, {par: 5, hcap: 5},
                    {par: 4, hcap: 14}, {par: 4, hcap: 16}, {par: 3, hcap: 18}, {par: 5, hcap: 4}, {par: 4, hcap: 2}, {par: 4, hcap: 10}, {par: 3, hcap: 12}, {par: 4, hcap: 6}, {par: 5, hcap: 8}
                ],
                players: [
                    { name: 'Ben', aguHCap: '19.9', dailyHCap: 20.12 }, { name: 'Ian', aguHCap: '16.9', dailyHCap: 17.01 },
                    { name: 'Peter', aguHCap: '23.5', dailyHCap: 24.53 }, { name: 'Neale', aguHCap: '27.8', dailyHCap: 29.11 },
                    { name: 'Neal', aguHCap: '7.1', dailyHCap: 6.04 }, { name: 'Dennis', aguHCap: '14.3', dailyHCap: 14.28 },
                    { name: 'Tony', aguHCap: '29.8', dailyHCap: 31.25 }, { name: 'Brad', aguHCap: '31', dailyHCap: 32.88 }
                ]
            },
            4: {
                course: 'BRG Da Nang Golf Resort', tees: 'yellow tees', slope: 130, scratch: 70, par: 72,
                holes: [
                    {par: 4, hcap: 9}, {par: 4, hcap: 11}, {par: 5, hcap: 3}, {par: 3, hcap: 15}, {par: 4, hcap: 1}, {par: 4, hcap: 13}, {par: 4, hcap: 7}, {par: 3, hcap: 17}, {par: 5, hcap: 5},
                    {par: 4, hcap: 14}, {par: 4, hcap: 16}, {par: 3, hcap: 18}, {par: 5, hcap: 4}, {par: 4, hcap: 2}, {par: 4, hcap: 10}, {par: 3, hcap: 12}, {par: 4, hcap: 6}, {par: 5, hcap: 8}
                ],
                players: [
                    { name: 'Ben', aguHCap: '19.9', dailyHCap: 19.15 }, { name: 'Ian', aguHCap: '16.9', dailyHCap: 16.09 },
                    { name: 'Peter', aguHCap: '23.5', dailyHCap: 22.95 }, { name: 'Neale', aguHCap: '27.8', dailyHCap: 27.88 },
                    { name: 'Neal', aguHCap: '7.1', dailyHCap: 5.21 }, { name: 'Dennis', aguHCap: '14.3', dailyHCap: 12.99 },
                    { name: 'Tony', aguHCap: '29.8', dailyHCap: 29.98 }, { name: 'Brad', aguHCap: '31', dailyHCap: 31.12 }
                ]
            }
        };

        const formGuideData = {
            'Ben': { barrier: 1, form: '3461', odds: '$8.00', comment: '2024 winner returns for another edition of the Cup.' },
            'Ian': { barrier: 2, form: 'x242', odds: '$5.00', comment: '2024 Hunter Valley runner up is always a consistent performer.' },
            'Peter': { barrier: 3, form: '1275', odds: '$15.00', comment: 'Peb comes into the cup with plenty of runs.' },
            'Neale': { barrier: 4, form: 'x445', odds: '$20.00', comment: 'Dark horse who swooped late in the Hunter.' },
            'Neal': { barrier: 5, form: '1116', odds: '$4.00', comment: 'Proven strong stayer winning 6 cups.' },
            'Dennis': { barrier: 6, form: '5x2x', odds: '$6.00', comment: 'The old grey war horse returns from a long spell.' },
            'Tony': { barrier: 7, form: '20', odds: '$20.00', comment: 'First emergency-maiden starter.' },
            'Brad': { barrier: 8, form: '6', odds: '$33.00', comment: 'Second emergency-with one Australian hit out.' }
        };

        const playingGroupsData = {
            1: { grouping: 'Handicap order', groups: ['1+8', '2+7', '3+6', '4+5'] },
            2: { grouping: 'Day 1 results', groups: ['1+8', '2+7', '3+6', '4+5'] },
            3: { grouping: 'Handicaps-split up teams', groups: ['3+5', '4+7', '2+8', '1+6'] },
            4: { grouping: 'Day 3 Order of merit', groups: ['1+2', '3+4', '5+6', '7+8'] }
        };

        let db, auth, currentUser, currentRound = 1, playersData = [], unsubscribeFromSnapshot = null;

        const calculateInScore = (scores) => scores.slice(0, 9).reduce((sum, score) => sum + (parseInt(score) || 0), 0);
        const calculateOutScore = (scores) => scores.slice(9, 18).reduce((sum, score) => sum + (parseInt(score) || 0), 0);
        const calculateTotalScore = (scores) => scores.reduce((sum, score) => sum + (parseInt(score) || 0), 0);
        
        const calculateStablefordPoints = (grossScore, holePar, handicapStrokes) => {
            if (!grossScore || !holePar) return 0;
            const netScore = grossScore - (handicapStrokes || 0);
            return Math.max(0, 2 - (netScore - holePar));
        };

        const showStatusMessage = (message) => {
            const modal = document.getElementById('status-modal');
            const msgElement = document.getElementById('status-message');
            if (!modal || !msgElement) return;
            msgElement.textContent = message;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => modal.classList.add('hidden'), 2500);
        };

        const initializeFirebase = async () => {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                
                await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        const display = document.getElementById('user-id-display');
                        if (display) display.textContent = `Connected (ID: ${currentUser.uid.substring(0,6)}...)`;
                        fetchDataForRound(currentRound);
                    }
                });
            } catch (e) {
                console.error("Firebase fallback:", e);
                fetchDataForRound(currentRound);
            }
        };

        const fetchDataForRound = (roundNumber) => {
            if (unsubscribeFromSnapshot) unsubscribeFromSnapshot();
            
            playersData = roundsData[roundNumber].players.map(p => ({
                ...p, 
                scores: p.scores || Array(18).fill(''), 
                threePutts: p.threePutts || Array(18).fill(''), 
                stablefordPoints: p.stablefordPoints || Array(18).fill('')
            }));
            
            // Immediately render using local memory data
            renderScorecard();

            // Perform real-time listener binding in background
            if (db && currentUser) {
                const collectionPath = `artifacts/${appId}/public/data/golf-scorecard-r${roundNumber}`;
                const q = collection(db, collectionPath);
                
                unsubscribeFromSnapshot = onSnapshot(q, (snapshot) => {
                    const fetched = {};
                    snapshot.forEach((doc) => {
                        if (doc.id === '_courseMetadata') {
                            Object.assign(roundsData[roundNumber], doc.data());
                        } else {
                            fetched[doc.id] = doc.data();
                        }
                    });

                    playersData = roundsData[roundNumber].players.map(player => {
                        const pData = fetched[player.name];
                        return pData ? {
                            ...player,
                            scores: pData.scores || Array(18).fill(''),
                            threePutts: pData.threePutts || Array(18).fill(''),
                            stablefordPoints: pData.stablefordPoints || Array(18).fill('')
                        } : player;
                    });
                    renderScorecard();
                }, (e) => {
                    console.warn("Firestore sync warning:", e);
                });
            }
        };

        const renderScorecard = () => {
            const roundDetails = roundsData[currentRound];
            const contentDiv = document.getElementById('content');
            if (!contentDiv) return;
            
            const inPar = roundDetails.holes.slice(0, 9).reduce((sum, h) => sum + h.par, 0);
            const outPar = roundDetails.holes.slice(9, 18).reduce((sum, h) => sum + h.par, 0);
            roundDetails.par = inPar + outPar;

            contentDiv.innerHTML = `
            <div id="scorecard-wrapper">
                <div class="bg-gradient-to-r from-emerald-800 to-teal-900 text-white p-4 rounded-xl shadow-lg mb-6">
                    <div class="flex flex-wrap items-center gap-2 mb-3">
                        <h2 class="text-xl md:text-2xl font-bold">Round ${currentRound}:</h2>
                        <input type="text" value="${roundDetails.course}" data-course-field="course" 
                            class="text-xl md:text-2xl font-bold bg-white/10 border border-white/20 rounded px-2 py-0.5 text-white focus:bg-white focus:text-gray-900 focus:outline-none" 
                            onchange="handleCourseMetadataChange(event)">
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                        <div class="flex flex-col font-bold">
                            <span class="text-emerald-200">Tees:</span>
                            <input type="text" value="${roundDetails.tees}" data-course-field="tees" 
                                class="font-normal bg-white/10 border border-white/20 rounded px-2 py-1 text-white focus:bg-white focus:text-gray-900 focus:outline-none" 
                                onchange="handleCourseMetadataChange(event)">
                        </div>
                        <div class="flex flex-col font-bold">
                            <span class="text-emerald-200">Slope Rate:</span>
                            <input type="number" step="any" value="${roundDetails.slope}" data-course-field="slope" 
                                class="font-normal bg-white/10 border border-white/20 rounded px-2 py-1 text-white focus:bg-white focus:text-gray-900 focus:outline-none" 
                                onchange="handleCourseMetadataChange(event)">
                        </div>
                        <div class="flex flex-col font-bold">
                            <span class="text-emerald-200">Scratch:</span>
                            <input type="number" step="any" value="${roundDetails.scratch}" data-course-field="scratch" 
                                class="font-normal bg-white/10 border border-white/20 rounded px-2 py-1 text-white focus:bg-white focus:text-gray-900 focus:outline-none" 
                                onchange="handleCourseMetadataChange(event)">
                        </div>
                        <div class="flex flex-col font-bold">
                            <span class="text-emerald-200">Par:</span>
                            <span class="font-semibold text-white py-1">${roundDetails.par}</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap justify-center gap-2 mb-6 p-2 rounded-xl bg-gray-100">
                    ${[1, 2, 3, 4].map(round => `
                        <button type="button" data-round="${round}" class="px-4 py-2 rounded-lg font-medium transition-colors shadow-sm ${currentRound === round ? 'bg-emerald-700 text-white' : 'bg-white text-gray-700 hover:bg-gray-200'}">
                            Round ${round}
                        </button>
                    `).join('')}
                </div>

                <div class="overflow-x-auto shadow-xl rounded-xl border border-gray-200">
                    <table class="min-w-full border-collapse text-xs md:text-sm">
                        <thead>
                            <tr class="bg-gray-800 text-white">
                                <th class="p-2 text-left sticky-col-header bg-gray-800">Player</th>
                                <th class="px-2 py-2 text-center">GA</th>
                                <th class="px-2 py-2 text-center">Daily</th>
                                ${[...Array(9)].map((_, i) => `<th class="p-1 text-center">H${i + 1}</th>`).join('')}
                                <th class="p-1 text-center bg-gray-700">In</th>
                                ${[...Array(9)].map((_, i) => `<th class="p-1 text-center">H${i + 10}</th>`).join('')}
                                <th class="p-1 text-center bg-gray-700">Out</th>
                                <th class="p-1 text-center bg-gray-900">Total</th>
                            </tr>
                            <tr class="bg-gray-700 text-white font-medium">
                                <td class="p-2 text-center sticky-col-header bg-gray-700">Par</td>
                                <td colspan="2" class="p-1 text-center"></td>
                                ${roundsData[currentRound].holes.slice(0, 9).map((hole, i) => `
                                    <td class="p-0.5 text-center">
                                        <input type="number" value="${hole.par}" data-hole-index="${i}" data-hole-type="par"
                                        class="hole-input" oninput="handleCourseDataChange(event)">
                                    </td>
                                `).join('')}
                                <td class="p-1 text-center font-bold bg-gray-800">${inPar}</td>
                                ${roundsData[currentRound].holes.slice(9, 18).map((hole, i) => `
                                    <td class="p-0.5 text-center">
                                        <input type="number" value="${hole.par}" data-hole-index="${i + 9}" data-hole-type="par"
                                        class="hole-input" oninput="handleCourseDataChange(event)">
                                    </td>
                                `).join('')}
                                <td class="p-1 text-center font-bold bg-gray-800">${outPar}</td>
                                <td class="p-1 text-center font-bold bg-gray-900">${roundDetails.par}</td>
                            </tr>
                        </thead>
                        <tbody>
                            ${playersData.map((player, playerIndex) => `
                                <tr class="${playerIndex % 2 === 0 ? 'bg-gray-50' : 'bg-white'} border-b border-gray-200">
                                    <td class="p-2 font-bold text-gray-800 sticky-col-header bg-inherit">${player.name}</td>
                                    <td class="p-1 text-center text-gray-500">${player.aguHCap}</td>
                                    <td class="p-1 text-center text-gray-600 font-semibold">${player.dailyHCap}</td>
                                    ${player.scores.slice(0, 9).map((score, scoreIndex) => `
                                        <td class="p-0.5 text-center">
                                            <input type="number" inputmode="numeric" value="${score}" data-player-name="${player.name}" data-score-index="${scoreIndex}" data-score-type="scores"
                                            class="w-7 h-6 text-center border border-gray-300 rounded focus:border-emerald-500 focus:outline-none bg-white font-medium" oninput="handleScoreChange(event)">
                                        </td>
                                    `).join('')}
                                    <td class="p-1 text-center font-bold bg-gray-100">${calculateInScore(player.scores)}</td>
                                    ${player.scores.slice(9, 18).map((score, scoreIndex) => `
                                        <td class="p-0.5 text-center">
                                            <input type="number" inputmode="numeric" value="${score}" data-player-name="${player.name}" data-score-index="${scoreIndex + 9}" data-score-type="scores"
                                            class="w-7 h-6 text-center border border-gray-300 rounded focus:border-emerald-500 focus:outline-none bg-white font-medium" oninput="handleScoreChange(event)">
                                        </td>
                                    `).join('')}
                                    <td class="p-1 text-center font-bold bg-gray-100">${calculateOutScore(player.scores)}</td>
                                    <td class="p-1 text-center font-bold bg-emerald-100 text-emerald-900">${calculateTotalScore(player.scores)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
            `;
            
            document.querySelectorAll('[data-round]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    currentRound = parseInt(e.target.dataset.round);
                    fetchDataForRound(currentRound);
                });
            });
        };

        window.handleCourseMetadataChange = async (e) => {
            const field = e.target.dataset.courseField;
            let value = e.target.value;
            if (field === 'slope' || field === 'scratch') value = parseFloat(value) || 0;

            roundsData[currentRound][field] = value;

            if (db && currentUser) {
                try {
                    const collectionPath = `artifacts/${appId}/public/data/golf-scorecard-r${currentRound}`;
                    await setDoc(doc(db, collectionPath, '_courseMetadata'), { [field]: value, lastUpdated: serverTimestamp() }, { merge: true });
                    showStatusMessage('Course info saved!');
                } catch (err) {
                    console.error('Save error:', err);
                }
            }
        };

        window.handleScoreChange = async (e) => {
            const { playerName, scoreIndex } = e.target.dataset;
            const sIndex = parseInt(scoreIndex);
            const playerToUpdate = playersData.find(p => p.name === playerName);
            const roundDetails = roundsData[currentRound];
            
            if (!playerToUpdate || !roundDetails) return;

            const grossScore = parseInt(e.target.value) || '';
            playerToUpdate.scores[sIndex] = grossScore;
            
            const holePar = roundDetails.holes[sIndex].par;
            const holeHCap = roundDetails.holes[sIndex].hcap;
            const dailyHCapRounded = Math.round(playerToUpdate.dailyHCap);
            
            const strokesPerRound = Math.floor(dailyHCapRounded / 18);
            const remainingStrokes = dailyHCapRounded % 18;
            const handicapStrokes = (holeHCap <= remainingStrokes) ? strokesPerRound + 1 : strokesPerRound;

            playerToUpdate.stablefordPoints[sIndex] = calculateStablefordPoints(grossScore, holePar, handicapStrokes);

            renderScorecard();

            if (db && currentUser) {
                try {
                    const collectionPath = `artifacts/${appId}/public/data/golf-scorecard-r${currentRound}`;
                    await setDoc(doc(db, collectionPath, playerName), {
                        playerName,
                        scores: playerToUpdate.scores,
                        stablefordPoints: playerToUpdate.stablefordPoints,
                        lastUpdated: serverTimestamp()
                    }, { merge: true });
                    showStatusMessage('Score updated');
                } catch (error) {
                    console.error("Score save error:", error);
                }
            }
        };

        window.handleCourseDataChange = (e) => {
            const { holeIndex, holeType } = e.target.dataset;
            const value = parseInt(e.target.value);
            const index = parseInt(holeIndex);
            if (isNaN(value)) return;

            if (holeType === 'par') roundsData[currentRound].holes[index].par = value;
            renderScorecard();
        };

        const renderPage = (page) => {
            const contentDiv = document.getElementById('content');
            if (!contentDiv) return;
            
            document.querySelectorAll('nav button').forEach(btn => {
                btn.className = "px-4 py-2 rounded-lg font-semibold transition-all bg-gray-200 text-gray-800 hover:bg-gray-300";
            });
            
            const activeMap = {
                'scorecard': 'scorecard-btn',
                'formGuide': 'form-guide-btn',
                'rules': 'rules-btn',
                'playingGroups': 'groups-btn'
            };

            const activeBtn = document.getElementById(activeMap[page]);
            if (activeBtn) activeBtn.className = "px-4 py-2 rounded-lg font-semibold transition-all shadow-lg bg-gray-700 text-white";

            if (page === 'scorecard') {
                fetchDataForRound(currentRound);
            } else if (page === 'formGuide') {
                contentDiv.innerHTML = `
                    <h2 class="text-2xl font-bold mb-4">Player Form Guide</h2>
                    <div class="grid md:grid-cols-2 gap-4">
                        ${Object.entries(formGuideData).map(([name, data]) => `
                            <div class="p-4 rounded-xl bg-white border border-gray-200 shadow-sm">
                                <div class="flex justify-between items-center mb-2">
                                    <h3 class="font-bold text-lg">${name}</h3>
                                    <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded">Odds: ${data.odds}</span>
                                </div>
                                <p class="text-sm text-gray-600 mb-1"><strong>Form:</strong> ${data.form}</p>
                                <p class="text-sm text-gray-700">${data.comment}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (page === 'rules') {
                contentDiv.innerHTML = `
                    <h2 class="text-2xl font-bold mb-4">Tournament Rules</h2>
                    <ul class="list-disc pl-5 space-y-2 text-gray-700">
                        <li>Stableford scoring format across all rounds.</li>
                        <li>Daily handicaps calculated per venue slope/scratch rating.</li>
                        <li>Please submit scores after completion of each hole.</li>
                    </ul>
                `;
            } else if (page === 'playingGroups') {
                const groups = playingGroupsData[currentRound];
                contentDiv.innerHTML = `
                    <h2 class="text-2xl font-bold mb-2">Round ${currentRound} Groups</h2>
                    <p class="text-sm text-gray-600 mb-4">Grouping criteria: ${groups.grouping}</p>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        ${groups.groups.map((g, i) => `
                            <div class="p-3 bg-emerald-50 rounded-lg border border-emerald-200 text-center font-bold text-emerald-900">
                                Group ${i + 1}: ${g}
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        };

        window.renderPage = renderPage;

        document.addEventListener('DOMContentLoaded', () => {
            initializeFirebase();
            document.getElementById('scorecard-btn')?.addEventListener('click', () => renderPage('scorecard'));
            document.getElementById('form-guide-btn')?.addEventListener('click', () => renderPage('formGuide'));
            document.getElementById('rules-btn')?.addEventListener('click', () => renderPage('rules'));
            document.getElementById('groups-btn')?.addEventListener('click', () => renderPage('playingGroups'));
        });
    </script>
</body>
</html>
